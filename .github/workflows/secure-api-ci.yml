name: CI

on:
  workflow_call:
  push:
    paths:
      - "projects/secure-api-platform/**"
  pull_request:
    paths:
      - "projects/secure-api-platform/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend: 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/secure-api-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/secure-api-platform/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall app tests
      - name: Run API and security tests
        run: python -m pytest -q
      - name: Bandit SAST
        run: bandit -r app -c .bandit -q
      - name: Python dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/secure-api-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Show resolved security-sensitive versions
        run: npm ls next postcss --depth=1
      - name: TypeScript check
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build

  container-scan:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --pull -t secure-api-platform:${{ github.sha }} projects/secure-api-platform
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: projects/secure-api-platform
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - name: Upload filesystem scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
      - name: Trivy filesystem policy gate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: projects/secure-api-platform
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: secure-api-platform:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
